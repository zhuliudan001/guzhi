<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金估值查询 | 自选基金管理</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="./" aria-label="基金估值首页">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                </span>
                <span class="brand-name">基金估值</span>
            </a>

            <div class="search-area">
                <form class="search-form" id="searchForm" role="search" novalidate>
                    <span class="search-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </span>
                    <label class="visually-hidden" for="fundCode">基金代码</label>
                    <input id="fundCode" class="search-input" type="text" inputmode="numeric" autocomplete="off"
                        maxlength="6" placeholder="输入 6 位基金代码，如 000001" aria-describedby="searchError">
                    <button id="searchBtn" class="btn btn-primary" type="submit">查询</button>
                </form>
                <p class="search-error" id="searchError" role="alert" hidden></p>

                <div class="search-history" id="historySection" hidden aria-labelledby="historyLabel">
                    <div class="search-history-head">
                        <span id="historyLabel">最近搜索</span>
                        <button id="clearHistoryBtn" class="text-btn" type="button">清空记录</button>
                    </div>
                    <div class="history-tags" id="searchHistory"></div>
                </div>
            </div>

            <div class="topbar-status" id="tradingStatus" aria-live="polite">
                <span class="trading-state"><span class="status-dot"></span><span>加载中</span></span>
            </div>
        </div>
    </header>

    <main id="main" class="page">
        <h1 class="visually-hidden">基金估值查询</h1>
        <section id="summarySection" class="portfolio" aria-labelledby="summaryTitle" hidden>
            <div class="portfolio-head">
                <h2 id="summaryTitle" class="section-title">持仓概览</h2>
                <span class="section-note">按最新净值与盘中估值测算</span>
            </div>
            <div class="summary-grid" id="summaryGrid"></div>
        </section>

        <section class="ledger" aria-labelledby="ledgerTitle">
            <div class="ledger-head">
                <div class="ledger-heading">
                    <h2 id="ledgerTitle" class="page-title">自选基金</h2>
                    <p class="ledger-sub" id="favoritesMeta">加载中…</p>
                </div>
                <div class="toolbar">
                    <button id="refreshFavoritesBtn" class="btn btn-secondary btn-sm" type="button" title="刷新全部自选">
                        <span class="svg-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span>
                        刷新
                    </button>
                    <button id="sortFavoritesBtn" class="btn btn-secondary btn-sm" type="button" title="按今日估算涨幅从高到低排序">
                        <span class="svg-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="16" y2="12"/><line x1="4" y1="18" x2="12" y2="18"/><polyline points="18 15 21 18 18 21"/><line x1="21" y1="15" x2="21" y2="18"/></svg></span>
                        排序
                    </button>
                    <button id="backupBtn" class="btn btn-secondary btn-sm" type="button" title="导出或导入本地数据">
                        <span class="svg-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg></span>
                        数据
                    </button>
                    <div class="auto-refresh">
                        <label class="switch" title="关闭后隐藏持仓金额与今日估算收益">
                            <input type="checkbox" id="positionVisibilitySwitch">
                            <span class="switch-track" aria-hidden="true"></span>
                            <span class="switch-label">显示持仓</span>
                        </label>
                        <label class="switch">
                            <input type="checkbox" id="autoRefreshSwitch">
                            <span class="switch-track" aria-hidden="true"></span>
                            <span class="switch-label">自动刷新</span>
                        </label>
                        <span class="auto-refresh-interval" id="refreshInterval">5分钟</span>
                    </div>
                </div>
            </div>

            <div class="table-card">
                <div class="table-wrap">
                    <table class="ledger-table">
                        <thead>
                            <tr>
                                <th scope="col">基金</th>
                                <th scope="col" class="num">参考净值</th>
                                <th scope="col" class="num" title="有盘中估值时显示估值涨幅；无估值时显示最新净值日涨跌">估算涨幅</th>
                                <th scope="col" class="num">日涨跌</th>
                                <th scope="col" class="num col-date">净值日期</th>
                                <th scope="col" class="num">持仓</th>
                                <th scope="col" class="num">今日估算收益</th>
                                <th scope="col" class="col-actions">操作</th>
                            </tr>
                        </thead>
                        <tbody id="favoritesList"></tbody>
                    </table>
                </div>

                <div class="mobile-list" id="favoritesCardList"></div>

                <div id="emptyFavorites" class="empty" hidden>
                    <div class="empty-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                    </div>
                    <h2 class="empty-title">还没有自选基金</h2>
                    <p class="empty-desc">输入 6 位基金代码搜索，添加后即可在这里查看盘中估值与今日估算收益；也可以从本地备份恢复。</p>
                    <div class="empty-actions">
                        <button id="emptySearchBtn" class="btn btn-primary" type="button">去搜索</button>
                        <button id="restoreBackupBtn" class="btn btn-secondary" type="button">从备份恢复</button>
                    </div>
                </div>
            </div>

            <p class="ledger-foot">
                今日估算收益为相对最新净值的单日估算，不是累计盈亏。盘中估值为按持仓或关联行情测算的参考值，实际净值以基金公司公布为准。数据来源：东方财富基金 / 天天基金。
            </p>
        </section>
    </main>

    <dialog id="fundDrawer" class="drawer" aria-labelledby="drawerTitle">
        <div class="drawer-head">
            <div class="drawer-heading">
                <p class="drawer-eyebrow" id="drawerEyebrow">搜索结果</p>
                <h2 class="drawer-title" id="drawerTitle">基金</h2>
                <p class="drawer-sub" id="drawerSub"></p>
            </div>
            <div class="drawer-head-actions">
                <button class="btn btn-ghost drawer-back" id="drawerBack" type="button" hidden>返回</button>
                <button class="icon-btn drawer-close" id="drawerClose" type="button" aria-label="关闭" title="关闭">
                    <span class="svg-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
                </button>
            </div>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
        <div class="drawer-foot" id="drawerFoot" hidden></div>
    </dialog>

    <script src="app-utils.js"></script>
    <script src="app.js"></script>
</body>

</html>
